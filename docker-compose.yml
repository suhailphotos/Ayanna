services:
  db:
    image: suhailphotos/postgres-pgvector:16.0
    container_name: swara-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - swara_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks:
      - everest

  app:
    image: suhailphotos/swara:0.1.0
    container_name: swara-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_DIR: /backup
      PROJECT_ROOT: /app
    volumes:
      - .:/app:delegated              # Mount source for dev (remove in prod)
      - swara_backup:/backup          # Same shared backup volume
    depends_on:
      - db
    networks:
      - everest
    command: ["sleep", "infinity"]    # For dev: keep container running

networks:
  everest:
    external: true

volumes:
  swara_pgdata:
  swara_backup:
