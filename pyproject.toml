[tool.poetry]
name = "swara"
version = "0.1.0"
description = "Sound-based playlist organiser using deep audio embeddings"
authors = ["Suhail <suhailece@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "swara", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
tabulate = "^0.9.0"
pandas = "^2.2"
numpy = "^1.26"
scikit-learn = "^1.5"
umap-learn = "^0.5"
matplotlib = "^3.9"
tqdm = "^4.66"
spotdl = "4.2.11"
laion-clap = "*"
oauthmanager = "^0.1.12"
fastapi = "~0.103.2"
uvicorn = {extras = ["standard"], version = ">=0.23,<0.30"}
sqlmodel   = "^0.0.16"
alembic    = "^1.13"
pgvector   = "^0.2"          # vector type for SQLAlchemy
faiss-cpu  = "^1.7"          # dev-time vector search
wcwidth = "^0.2.13"
ujson = "^5.10.0"
psycopg = {version = ">=3.1,<3.2", extras = ["binary"]}

[tool.poetry.scripts]
swara = "swara.cli:cli"
swara-api = "swara.app.main:app"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
